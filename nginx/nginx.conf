# Block 2 · Host "Bảng Truy Nã" bằng Nginx (chạy project-local, không cần sudo)
# Chạy:  scripts/run.sh     Dừng:  scripts/stop.sh     Kiểm tra: nginx -t -p "$PWD" -c nginx/nginx.conf -e stderr
#
# Mọi đường dẫn tương đối đều tính từ prefix (-p = gốc repo).
# Riêng include thì tính từ thư mục chứa file conf này (nginx/).
worker_processes 1;
pid        logs/nginx.pid;
error_log  logs/error.log warn;

events { worker_connections 64; }

http {
    include       mime.types;                    # đuôi file → Content-Type (nginx/mime.types)
    default_type  application/octet-stream;      # đuôi lạ → browser không tự đoán
    charset       utf-8;
    charset_types text/css application/javascript text/javascript image/svg+xml;

    # Thêm Content-Type vào log để phía server cũng chứng minh được MIME
    log_format block2 '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'type="$sent_http_content_type" ref="$http_referer"';
    access_log logs/access.log block2;

    # Chạy không cần sudo: đưa các thư mục tạm vào repo
    client_body_temp_path tmp/body;    proxy_temp_path tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi; uwsgi_temp_path tmp/uwsgi; scgi_temp_path tmp/scgi;

    server {
        listen 127.0.0.1:8080;                     # chỉ máy mình truy cập được, không cần quyền admin
        root   site;                               # URL path được nối vào sau thư mục này
        index  index.html;                         # "/" → site/index.html

        location / {
            try_files $uri $uri/ =404;             # có file thì trả file, có thư mục thì tìm index, không có gì thì 404
        }
    }
}
